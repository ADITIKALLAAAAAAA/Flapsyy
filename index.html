<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flapsy — A Flapping Bird Game</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky-top: #1a1a2e;
    --sky-bottom: #16213e;
    --pipe-green: #2ecc71;
    --pipe-dark: #27ae60;
    --pipe-shine: #58d68d;
    --ground: #e8c46a;
    --ground-dark: #c9a84c;
    --bird-yellow: #f9ca24;
    --bird-orange: #f0932b;
    --bird-eye: #fff;
    --bird-pupil: #2d3436;
    --score-color: #fff;
    --ui-font: 'Press Start 2P', monospace;
  }

  body {
    background: #0d0d1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: var(--ui-font);
  }

  #game-wrap {
    position: relative;
    width: 400px;
    height: 600px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 80px rgba(46,204,113,0.15), 0 0 0 2px rgba(255,255,255,0.05);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10,10,26,0.82);
    backdrop-filter: blur(4px);
    transition: opacity 0.3s;
  }

  #overlay.hidden { opacity: 0; pointer-events: none; }

  .title {
    font-size: 22px;
    color: #f9ca24;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(249,202,36,0.6), 3px 3px 0 #c0922a;
    margin-bottom: 8px;
    animation: titlePulse 2s ease-in-out infinite;
  }

  .subtitle {
    font-size: 7px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 48px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .best-score {
    font-size: 9px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 32px;
  }

  .best-score span {
    color: #f9ca24;
  }

  .tap-prompt {
    font-size: 10px;
    color: #2ecc71;
    animation: blink 1s step-end infinite;
    letter-spacing: 1px;
  }

  .final-score-label {
    font-size: 9px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 8px;
  }

  .final-score-num {
    font-size: 42px;
    color: #f9ca24;
    text-shadow: 0 0 30px rgba(249,202,36,0.5), 4px 4px 0 #c0922a;
    margin-bottom: 4px;
  }

  .medal {
    font-size: 32px;
    margin-bottom: 20px;
  }

  .new-best {
    font-size: 8px;
    color: #2ecc71;
    animation: blink 0.6s step-end infinite;
    margin-bottom: 28px;
  }

  @keyframes titlePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  #score-display {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 32px;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,255,255,0.3), 3px 3px 0 rgba(0,0,0,0.4);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }

  #score-display.visible { opacity: 1; }

  .instructions {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    font-size: 7px;
    color: rgba(255,255,255,0.3);
    white-space: nowrap;
  }

  .key-hint {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .key {
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 7px;
    color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>

<div id="game-wrap">
  <canvas id="c" width="400" height="600"></canvas>

  <div id="score-display">0</div>

  <div id="overlay">
    <!-- start screen filled by JS -->
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreDisplay = document.getElementById('score-display');

const W = 400, H = 600;
const GROUND_H = 80;
const PIPE_W = 60;
const PIPE_GAP = 155;
const GRAVITY = 0.45;
const JUMP = -8.5;
const PIPE_SPEED = 2.8;
const PIPE_INTERVAL = 1600;

let state = 'start'; // start | playing | dead
let score = 0;
let best = parseInt(localStorage.getItem('flapsy_best') || '0');
let animId;
let lastPipeTime = 0;
let bgStars = [];
let particles = [];
let screenShake = 0;
let flashAlpha = 0;

const bird = {
  x: 100, y: H / 2 - 40,
  vy: 0,
  r: 18,
  angle: 0,
  flapAnim: 0,
  alive: true
};

let pipes = [];
let clouds = [];

// === Stars ===
function initStars() {
  bgStars = [];
  for (let i = 0; i < 80; i++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * (H - GROUND_H),
      r: Math.random() * 1.5 + 0.3,
      a: Math.random(),
      speed: Math.random() * 0.3 + 0.1
    });
  }
}

function initClouds() {
  clouds = [];
  for (let i = 0; i < 5; i++) {
    clouds.push({
      x: Math.random() * W,
      y: 40 + Math.random() * 140,
      w: 60 + Math.random() * 80,
      speed: 0.3 + Math.random() * 0.4,
      alpha: 0.04 + Math.random() * 0.06
    });
  }
}

function spawnPipe(now) {
  const minY = 80;
  const maxY = H - GROUND_H - PIPE_GAP - 80;
  const topH = minY + Math.random() * (maxY - minY);
  pipes.push({ x: W + 10, topH, passed: false });
  lastPipeTime = now;
}

function reset() {
  bird.x = 100;
  bird.y = H / 2 - 40;
  bird.vy = 0;
  bird.angle = 0;
  bird.alive = true;
  pipes = [];
  particles = [];
  score = 0;
  screenShake = 0;
  flashAlpha = 0;
  scoreDisplay.textContent = '0';
  lastPipeTime = 0;
  initClouds();
}

function flap() {
  if (state === 'start') {
    state = 'playing';
    overlay.classList.add('hidden');
    scoreDisplay.classList.add('visible');
    reset();
    bird.vy = JUMP;
    bird.flapAnim = 1;
  } else if (state === 'playing' && bird.alive) {
    bird.vy = JUMP;
    bird.flapAnim = 1;
    spawnFeathers();
  } else if (state === 'dead') {
    state = 'playing';
    overlay.classList.add('hidden');
    scoreDisplay.classList.add('visible');
    reset();
    bird.vy = JUMP;
    bird.flapAnim = 1;
  }
}

function spawnFeathers() {
  for (let i = 0; i < 4; i++) {
    particles.push({
      x: bird.x - 5,
      y: bird.y,
      vx: (Math.random() - 0.5) * 3 - 1,
      vy: Math.random() * -2 + 1,
      life: 1,
      type: 'feather',
      color: Math.random() > 0.5 ? '#f9ca24' : '#f0932b',
      size: 4 + Math.random() * 4
    });
  }
}

function spawnDeathParticles() {
  for (let i = 0; i < 20; i++) {
    const ang = (Math.PI * 2 / 20) * i;
    const spd = 2 + Math.random() * 5;
    particles.push({
      x: bird.x, y: bird.y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 1,
      type: 'burst',
      color: ['#f9ca24','#f0932b','#fff','#2ecc71'][Math.floor(Math.random()*4)],
      size: 3 + Math.random() * 5
    });
  }
}

// === Draw helpers ===
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  grad.addColorStop(0, '#0d0d1a');
  grad.addColorStop(0.5, '#16213e');
  grad.addColorStop(1, '#1a2a4a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H - GROUND_H);
}

function drawStars(now) {
  bgStars.forEach(s => {
    s.a += s.speed * 0.02;
    const alpha = 0.4 + 0.4 * Math.sin(s.a);
    if (state === 'playing') s.x -= 0.4;
    if (s.x < 0) s.x = W;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  });
}

function drawClouds() {
  clouds.forEach(c => {
    if (state === 'playing') {
      c.x -= c.speed;
      if (c.x + c.w < 0) { c.x = W + c.w; c.y = 40 + Math.random() * 140; }
    }
    ctx.save();
    ctx.globalAlpha = c.alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w/2, 18, 0, 0, Math.PI*2);
    ctx.ellipse(c.x - c.w*0.2, c.y + 8, c.w*0.35, 14, 0, 0, Math.PI*2);
    ctx.ellipse(c.x + c.w*0.2, c.y + 8, c.w*0.35, 14, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

function drawGround(now) {
  const gy = H - GROUND_H;
  // dirt
  ctx.fillStyle = '#c9a84c';
  ctx.fillRect(0, gy, W, GROUND_H);
  // grass strip
  ctx.fillStyle = '#2ecc71';
  ctx.fillRect(0, gy, W, 16);
  // dark grass outline
  ctx.fillStyle = '#27ae60';
  ctx.fillRect(0, gy + 14, W, 3);
  // ground texture dots
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  const offset = state === 'playing' ? -(now * 0.003 * PIPE_SPEED * 60) % 32 : 0;
  for (let x = offset; x < W + 32; x += 32) {
    ctx.fillRect(x, gy + 24, 16, 8);
    ctx.fillRect(x + 16, gy + 40, 16, 8);
    ctx.fillRect(x, gy + 56, 16, 8);
  }
}

function drawPipe(pipe) {
  const botY = pipe.topH + PIPE_GAP;
  const cap = 12;

  // top pipe
  const tg = ctx.createLinearGradient(pipe.x, 0, pipe.x + PIPE_W, 0);
  tg.addColorStop(0, '#27ae60');
  tg.addColorStop(0.3, '#2ecc71');
  tg.addColorStop(0.7, '#2ecc71');
  tg.addColorStop(1, '#1e8449');
  ctx.fillStyle = tg;
  ctx.fillRect(pipe.x, 0, PIPE_W, pipe.topH);
  // top cap
  ctx.fillStyle = '#27ae60';
  ctx.fillRect(pipe.x - cap/2, pipe.topH - 28, PIPE_W + cap, 28);
  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(pipe.x + 8, 0, 10, pipe.topH - 28);

  // bottom pipe
  ctx.fillStyle = tg;
  ctx.fillRect(pipe.x, botY, PIPE_W, H - botY);
  ctx.fillStyle = '#27ae60';
  ctx.fillRect(pipe.x - cap/2, botY, PIPE_W + cap, 28);
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(pipe.x + 8, botY + 28, 10, H - botY - 28);
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.angle);

  const r = bird.r;
  const wingOff = Math.sin(bird.flapAnim * Math.PI) * 10;

  // wing shadow
  ctx.beginPath();
  ctx.ellipse(-4, wingOff - 2, r * 0.7, r * 0.38, -0.2, 0, Math.PI*2);
  ctx.fillStyle = '#d4a017';
  ctx.fill();

  // body
  const bg = ctx.createRadialGradient(-3, -5, 2, 0, 0, r);
  bg.addColorStop(0, '#fdd835');
  bg.addColorStop(0.6, '#f9ca24');
  bg.addColorStop(1, '#e6b800');
  ctx.beginPath();
  ctx.ellipse(0, 0, r, r * 0.85, 0, 0, Math.PI*2);
  ctx.fillStyle = bg;
  ctx.fill();

  // belly
  ctx.beginPath();
  ctx.ellipse(4, 6, r * 0.55, r * 0.45, 0.3, 0, Math.PI*2);
  ctx.fillStyle = '#f0932b';
  ctx.fill();

  // wing
  ctx.beginPath();
  ctx.ellipse(-5, wingOff, r * 0.65, r * 0.32, -0.3, 0, Math.PI*2);
  ctx.fillStyle = '#f9ca24';
  ctx.strokeStyle = '#d4a017';
  ctx.lineWidth = 1;
  ctx.fill();
  ctx.stroke();

  // eye white
  ctx.beginPath();
  ctx.arc(r * 0.4, -r * 0.2, r * 0.32, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  // pupil
  ctx.beginPath();
  ctx.arc(r * 0.48, -r * 0.18, r * 0.16, 0, Math.PI*2);
  ctx.fillStyle = '#2d3436';
  ctx.fill();

  // eye shine
  ctx.beginPath();
  ctx.arc(r * 0.52, -r * 0.28, r * 0.07, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  // beak
  ctx.beginPath();
  ctx.moveTo(r * 0.75, -r * 0.05);
  ctx.lineTo(r * 1.25, r * 0.1);
  ctx.lineTo(r * 0.75, r * 0.25);
  ctx.closePath();
  ctx.fillStyle = '#e17055';
  ctx.fill();

  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    if (p.type === 'feather') {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.size, p.size * 0.4, p.vx * 0.5, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  });
}

function drawHUD() {
  // score shadow (already in DOM overlay, this is just canvas backup)
}

function drawFlash() {
  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
    flashAlpha -= 0.08;
  }
}

// === Collision ===
function collides(pipe) {
  const bx = bird.x, by = bird.y, br = bird.r * 0.78;
  const cap = 6;
  const px = pipe.x - cap/2, pw = PIPE_W + cap;

  if (bx + br < px || bx - br > px + pw) return false;

  if (by - br < pipe.topH) return true;
  if (by + br > pipe.topH + PIPE_GAP) return true;
  return false;
}

// === Main loop ===
let lastTime = 0;
function loop(now) {
  animId = requestAnimationFrame(loop);
  const dt = now - lastTime;
  lastTime = now;

  ctx.save();
  if (screenShake > 0) {
    const sx = (Math.random() - 0.5) * screenShake;
    const sy = (Math.random() - 0.5) * screenShake;
    ctx.translate(sx, sy);
    screenShake *= 0.85;
    if (screenShake < 0.5) screenShake = 0;
  }

  // --- Update ---
  if (state === 'playing') {
    // Bird physics
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.angle = Math.max(-0.5, Math.min(Math.PI / 2, bird.vy * 0.055));

    if (bird.flapAnim > 0) bird.flapAnim = Math.max(0, bird.flapAnim - 0.08);

    // Spawn pipes
    if (!lastPipeTime || now - lastPipeTime > PIPE_INTERVAL) spawnPipe(now);

    // Move pipes
    pipes.forEach(p => {
      p.x -= PIPE_SPEED;
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        score++;
        scoreDisplay.textContent = score;
        if (score > best) best = score;
      }
    });
    pipes = pipes.filter(p => p.x > -PIPE_W - 20);

    // Particles
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.life -= 0.025;
    });
    particles = particles.filter(p => p.life > 0);

    // Collision
    if (bird.y - bird.r > H - GROUND_H || bird.y + bird.r < 0) {
      die();
    }
    for (const p of pipes) {
      if (collides(p)) { die(); break; }
    }
  }

  // --- Draw ---
  drawSky();
  drawStars(now);
  drawClouds();
  pipes.forEach(drawPipe);
  drawGround(now);
  if (state !== 'start') drawBird();
  drawParticles();
  drawFlash();

  ctx.restore();
}

function die() {
  if (!bird.alive) return;
  bird.alive = false;
  state = 'dead';
  screenShake = 10;
  flashAlpha = 0.6;
  spawnDeathParticles();
  localStorage.setItem('flapsy_best', best);

  setTimeout(() => {
    showDeathScreen();
  }, 600);
}

// === UI ===
function showStartScreen() {
  overlay.innerHTML = `
    <div class="title">FLAPSY</div>
    <div class="subtitle">tap to survive</div>
    <div class="best-score">best: <span>${best}</span></div>
    <div class="tap-prompt">[ tap / space / click ]</div>
    <div class="instructions" style="position:relative;bottom:auto;left:auto;transform:none;margin-top:40px;">
      <span class="key-hint"><span class="key">SPACE</span> flap</span>
      <span class="key-hint"><span class="key">TAP</span> flap</span>
    </div>
  `;
  overlay.classList.remove('hidden');
}

function showDeathScreen() {
  const isNew = score >= best && score > 0;
  const medal = score >= 40 ? '🏆' : score >= 20 ? '🥇' : score >= 10 ? '🥈' : score >= 5 ? '🥉' : '💀';
  overlay.innerHTML = `
    <div class="title" style="font-size:14px;margin-bottom:6px;">GAME OVER</div>
    <div class="medal">${medal}</div>
    <div class="final-score-label">score</div>
    <div class="final-score-num">${score}</div>
    ${isNew ? '<div class="new-best">✦ new best ✦</div>' : `<div class="best-score" style="margin-bottom:28px;">best: <span>${best}</span></div>`}
    <div class="tap-prompt">[ tap to restart ]</div>
  `;
  overlay.classList.remove('hidden');
  scoreDisplay.classList.remove('visible');
}

// === Input ===
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    flap();
  }
});
canvas.addEventListener('click', flap);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });
document.getElementById('game-wrap').addEventListener('click', flap);

// === Init ===
initStars();
initClouds();
showStartScreen();
requestAnimationFrame(loop);
</script>
</body>
</html>
